<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1f20"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c8df6"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5c9eff"/>
      <stop offset="100%" stop-color="#8c5eff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background App Rounded Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#333333" stroke-width="4" filter="url(#shadow)"/>

  <!-- Film Reel / Clapper Frame -->
  <rect x="96" y="96" width="320" height="320" rx="32" fill="#141416" stroke="#2c2d30" stroke-width="4"/>

  <!-- Vertical 9:16 Crop Guide (Highlighting Shorts creation) -->
  <rect x="184" y="112" width="144" height="288" rx="16" fill="url(#primaryGrad)" fill-opacity="0.2" stroke="url(#primaryGrad)" stroke-width="4" stroke-dasharray="12 6"/>

  <!-- Scissors / Clipper Blade Cut -->
  <g transform="translate(256,256) scale(1.1) translate(-256,-256)">
    <!-- Right Blade -->
    <path d="M190 190 L320 320 M320 190 L190 320" stroke="url(#accentGrad)" stroke-width="24" stroke-linecap="round"/>

    <!-- Scissor Pivot -->
    <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#shadow)"/>
    <circle cx="256" cy="256" r="8" fill="#4c8df6"/>

    <!-- Handle Rings -->
    <circle cx="160" cy="160" r="36" fill="none" stroke="url(#accentGrad)" stroke-width="18"/>
    <circle cx="160" cy="352" r="36" fill="none" stroke="url(#accentGrad)" stroke-width="18"/>
  </g>

  <!-- Play Symbol inside Shorts aspect box -->
  <polygon points="340,256 380,230 380,282" fill="#4c8df6"/>
</svg>
